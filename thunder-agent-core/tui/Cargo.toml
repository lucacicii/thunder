[package]
name = "thunder-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Interactive Terminal User Interface for Thunder Agent"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "tui", "ratatui", "terminal", "llm"]
categories = ["command-line-utilities", "asynchronous"]

[[bin]]
name = "thunder-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
thunder-agent-loop.workspace = true
thunder-conversation.workspace = true
thunder-agent-skills.workspace = true
thunder-agent-mcp.workspace = true
thunder-agent-root.workspace = true
thunder-agent-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
