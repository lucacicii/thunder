[package]
name = "thunder-conversation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Conversation and session management for Thunder Agent ecosystem"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "conversation", "session", "llm", "orchestration"]
categories = ["asynchronous"]

[lints]
workspace = true

[dependencies]
thunder-agent-loop.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi"] }
