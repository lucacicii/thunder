[package]
name = "thunder-conversation"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["thunder-luc"]
description = "Conversation and session management for Thunder Agent ecosystem"
license = "Apache-2.0"
readme = "README.md"
keywords = ["agent", "conversation", "session", "llm", "orchestration"]
categories = ["asynchronous"]

[dependencies]
thunder-agent-loop = { path = "../../thunder-agent-loop" }
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
