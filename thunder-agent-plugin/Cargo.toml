[package]
name = "thunder-agent-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Lightweight TypeScript Single-File Plugin Runtime and Sidecar Host for Thunder Agent"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
thunder-agent-loop.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs"] }
tokio-util = { workspace = true, features = ["codec", "io"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures-util.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true, features = ["ansi"] }
tempfile.workspace = true
