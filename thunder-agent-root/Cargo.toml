[package]
name = "thunder-agent-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Extensible microkernel host and dynamic plugin orchestration engine for Thunder Agent"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "microkernel", "plugin", "llm"]
categories = ["command-line-utilities", "asynchronous"]

[lints]
workspace = true

[dependencies]
thunder-agent-loop.workspace = true
thunder-agent-pack-code.workspace = true
thunder-conversation = { workspace = true, optional = true }
thunder-agent-skills = { workspace = true, optional = true }
thunder-agent-mcp = { workspace = true, optional = true }
thunder-agent-providers.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["charset", "gzip"] }
parking_lot.workspace = true
htmd.workspace = true
html5ever.workspace = true
markup5ever_rcdom.workspace = true
tracing.workspace = true
futures-util.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi"] }

[features]
default = ["conversation", "skills", "mcp"]
conversation = ["dep:thunder-conversation"]
skills = ["dep:thunder-agent-skills"]
mcp = ["dep:thunder-agent-mcp"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
