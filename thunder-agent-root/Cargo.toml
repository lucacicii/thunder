[package]
name = "thunder-agent-root"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["thunder-luc"]
description = "Extensible microkernel host and dynamic plugin orchestration engine for Thunder Agent"
license = "Apache-2.0"
readme = "README.md"
keywords = ["agent", "microkernel", "plugin", "llm"]
categories = ["command-line-utilities", "asynchronous"]

[dependencies]
thunder-agent-loop = { path = "../thunder-agent-loop" }
thunder-conversation = { path = "../thunder-agent-core/conversation", optional = true }
thunder-agent-skills = { path = "../thunder-agent-skills", optional = true }
thunder-agent-mcp = { path = "../thunder-agent-mcp", optional = true }
thunder-agent-plugin = { path = "../thunder-agent-plugin", optional = true }
thunder-agent-providers = { path = "../thunder-agent-providers" }
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
futures-util = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[features]
default = ["conversation", "skills", "mcp", "script-plugin"]
conversation = ["dep:thunder-conversation"]
skills = ["dep:thunder-agent-skills"]
mcp = ["dep:thunder-agent-mcp"]
script-plugin = ["dep:thunder-agent-plugin"]

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
tempfile = "3.10"
