name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned, not `@stable`: an unpinned stable is exactly what broke this job
        # when a new release changed rustfmt's output. Keep in step with
        # rust-toolchain.toml, which pins the same version for local builds.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # Same feature set the test run uses (test.sh): without it, everything
        # behind #[cfg(feature = "testing-mock")] — the daemon's mock model and
        # most of daemon_ipc_test — is never linted, and since RUSTFLAGS turns
        # warnings into errors, a problem there would only ever surface at the
        # last step with no earlier signal.
        run: cargo clippy --workspace --all-targets --features thunder-agent-daemon/testing-mock -- -D warnings

  bridge-bundle:
    name: Verify pi-bridge bundle is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bundler
        working-directory: thunder-pi-bridge/runner
        run: npm ci

      - name: Rebuild bundled sidecar
        working-directory: thunder-pi-bridge/runner
        run: npm run build

      - name: Fail if committed bundle drifted from source
        run: |
          if ! git diff --quiet -- thunder-pi-bridge/runner/bridge.mjs; then
            echo "::error::runner/bridge.mjs is out of sync with bridge.src.mjs."
            echo "Run 'npm run build' in thunder-pi-bridge/runner and commit the result."
            git diff --stat -- thunder-pi-bridge/runner/bridge.mjs
            exit 1
          fi

  test:
    name: Workspace Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        # Pinned, not `@stable`: an unpinned stable is exactly what broke this job
        # when a new release changed rustfmt's output. Keep in step with
        # rust-toolchain.toml, which pins the same version for local builds.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        # Keep this in step with the feature set the suite runs with (test.sh),
        # so the code CI actually tests is the code CI checks.
        run: cargo check --workspace --all-targets --features thunder-agent-daemon/testing-mock

      - name: Run Test Suite
        run: ./test.sh
