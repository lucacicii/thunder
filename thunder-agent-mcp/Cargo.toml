[package]
name = "thunder-agent-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["thunder-luc"]
description = "Model Context Protocol (MCP) Client, Configuration Parser and Dynamic Tool Bridge for Thunder Agent"
license = "Apache-2.0"
readme = "README.md"
keywords = ["agent", "mcp", "protocol", "tools", "orchestration"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
thunder-agent-loop = { path = "../thunder-agent-loop" }
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
tempfile = "3.10"
