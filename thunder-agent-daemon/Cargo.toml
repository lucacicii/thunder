[package]
name = "thunder-agent-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "STDIO Sidecar Daemon for Electron, Desktop UIs and Headless Agent Host"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "daemon", "sidecar", "electron", "llm"]
categories = ["command-line-utilities", "asynchronous"]

[[bin]]
name = "thunder-daemon"
path = "src/main.rs"

[features]
# Test-only in-process fake LLM. Off by default so release binaries contain no
# mock code path; the daemon IPC tests enable it via
# `--features thunder-agent-daemon/testing-mock`.
default = []
testing-mock = []

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
thunder-agent-loop.workspace = true
thunder-conversation.workspace = true
thunder-agent-skills.workspace = true
thunder-agent-mcp.workspace = true
thunder-agent-root.workspace = true
thunder-agent-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
