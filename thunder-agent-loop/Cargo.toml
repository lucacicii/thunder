[package]
name = "thunder-agent-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Ultra-lightweight, high-performance, minimal-resource Agent Loop Engine in Rust"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/thunder-agent-loop"
keywords = ["agent", "llm", "loop", "openai", "tools"]
