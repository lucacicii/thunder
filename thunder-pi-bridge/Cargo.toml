[package]
name = "thunder-pi-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["thunder-luc"]
description = "Node sidecar bridge to @earendil-works/pi-ai: the single LLM transport for Thunder"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/lucacicii/thunder"
homepage = "https://github.com/lucacicii/thunder"
keywords = ["agent", "llm", "pi-ai", "bridge", "sidecar"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
thunder-agent-loop = { path = "../thunder-agent-loop" }
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
