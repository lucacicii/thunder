[package]
name = "thunder-pi-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Node sidecar bridge to @earendil-works/pi-ai: the single LLM transport for Thunder"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "pi-ai", "bridge", "sidecar"]
categories = ["asynchronous", "api-bindings"]

[lints]
workspace = true

[dependencies]
thunder-agent-loop.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
